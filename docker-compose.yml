# TiendaIA - Laboratorio 2
x-servicio: &servicio
  restart: unless-stopped
  build: &construir
    context: .
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 3s
    retries: 5

services:
  # ------------------------------ Bases de datos
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports: ["172.30.0.1:13306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tienda
      MYSQL_USER: tienda
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["172.30.0.1:27018:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["172.30.0.1:6379:6379"]
    volumes: [redis_data:/data]

  # ------------------------------ Microservicios
  clientes:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: clientes}}
    environment:
      DATABASE_URL: mysql+pymysql://tienda:${MYSQL_PASSWORD}@172.30.0.1:13306/tienda
    depends_on:
      mysql: {condition: service_healthy}
    ports: ["172.30.0.1:18001:8000"]

  productos:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: productos}}
    environment:
      MONGO_URL: mongodb://172.30.0.1:27018
    depends_on:
      mongo: {condition: service_healthy}
    ports: ["172.30.0.1:18002:8000"]

  ventas:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: ventas}}
    environment:
      REDIS_HOST: 172.30.0.1
      CLIENTES_URL: http://172.30.0.1:18001
      PRODUCTOS_URL: http://172.30.0.1:18002
    depends_on:
      redis: {condition: service_started}
      clientes: {condition: service_healthy}
      productos: {condition: service_healthy}
    ports: ["172.30.0.1:18003:8000"]

  ia:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: ia_service}}
    environment:
      VENTAS_URL: http://172.30.0.1:18003
      MODELO_PATH: /modelos/modelo.joblib
    volumes: [modelos:/modelos]
    depends_on:
      ventas: {condition: service_healthy}
    ports: ["172.30.0.1:18004:8000"]

  # ------------------------------ Punto de entrada
  gateway:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: gateway}}
    ports: ["8080:8000"]
    environment:
      CLIENTES_URL: http://172.30.0.1:18001
      PRODUCTOS_URL: http://172.30.0.1:18002
      VENTAS_URL: http://172.30.0.1:18003
      IA_URL: http://172.30.0.1:18004
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      clientes: {condition: service_healthy}
      productos: {condition: service_healthy}
      ventas: {condition: service_healthy}
      ia: {condition: service_healthy}

  # ------------------------------ Cliente web
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8081:80"]

  seaweedfs:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: >-
      server -dir=/data -volume.max=100 -master.volumeSizeLimitMB=1024
      -s3 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - seaweed_data:/data
      - ./seaweed/s3.json:/etc/seaweedfs/s3.json:ro

  imagenes:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: imagenes}}
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_BUCKET: tiendaia-imagenes
      S3_ACCESS_KEY: ${S3_ADMIN_KEY}
      S3_SECRET_KEY: ${S3_ADMIN_SECRET}
    depends_on: [seaweedfs, productos]


volumes:
  mysql_data:
  mongo_data:
  redis_data:
  modelos:
  seaweed_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1